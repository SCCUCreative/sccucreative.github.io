<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scott Free Group — Coming soon</title>
<meta name="description" content="Scott Free Group. Something new is taking shape. In the meantime, discover what drives you with the Six Human Needs Quiz.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#434B30">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23434B30'/%3E%3Cpath d='M18 26c4 6 8 8 12 7m4 6c5 5 10 6 14 5' fill='none' stroke='%23E3DED2' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --olive: #434B30;
    --olive-deep: #343B25;
    --sand: #E3DED2;
    --sand-soft: rgba(227,222,210,.72);
    --sand-dim: rgba(227,222,210,.45);
    --clay: #875F45;
    --clay-light: #E8B583;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center;
    background:
      radial-gradient(120% 80% at 50% 0%, #4E573A 0%, rgba(78,87,58,0) 60%),
      radial-gradient(90% 70% at 50% 110%, var(--olive-deep) 0%, rgba(52,59,37,0) 70%),
      var(--olive);
    color: var(--sand);
    font-family: 'Nunito', -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    padding: max(32px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  main { position: relative; z-index: 1; width: 100%; max-width: 560px; text-align: center; }
  .logo { display: block; width: min(320px, 72vw); height: auto; margin: 0 auto 44px; }
  .eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--clay-light); margin-bottom: 16px; }
  h1 { font-family: 'Comfortaa', 'Nunito', sans-serif; font-weight: 700; font-size: clamp(28px, 5.4vw, 44px); line-height: 1.15; margin-bottom: 18px; text-wrap: balance; }
  p.lede { font-size: 17px; line-height: 1.65; font-weight: 300; color: var(--sand-soft); max-width: 440px; margin: 0 auto; }
  .divider { width: 44px; height: 1.5px; background: var(--sand-dim); margin: 40px auto 30px; border-radius: 2px; }
  .quiz-label { font-size: 14px; color: var(--sand-dim); margin-bottom: 14px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'Comfortaa', 'Nunito', sans-serif; font-weight: 700; font-size: 16px;
    color: #fff; background: var(--clay); text-decoration: none;
    padding: 16px 34px; min-height: 48px; border-radius: 999px;
    box-shadow: 0 2px 10px rgba(30,34,20,.25);
    transition: transform .2s ease, background .2s ease;
  }
  .btn:hover { background: #966A4E; transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--clay-light); outline-offset: 3px; }
  .btn svg { width: 16px; height: 16px; }
  footer { margin-top: 48px; font-size: 12.5px; color: var(--sand-dim); }

  /* Birds drifting across, echoing the logo */
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bird { position: absolute; left: -60px; opacity: .22; animation: drift linear infinite; }
  .bird svg { display: block; animation: flap ease-in-out infinite; transform-origin: center; }
  .b1 { top: 14%; animation-duration: 46s; animation-delay: -8s; }
  .b1 svg { width: 34px; animation-duration: 1.9s; }
  .b2 { top: 22%; animation-duration: 58s; animation-delay: -30s; opacity: .14; }
  .b2 svg { width: 24px; animation-duration: 2.3s; }
  .b3 { top: 76%; animation-duration: 64s; animation-delay: -18s; opacity: .12; }
  .b3 svg { width: 28px; animation-duration: 2.1s; }
  @keyframes drift { from { transform: translate(0, 0); } 50% { transform: translate(55vw, -18px); } to { transform: translate(calc(100vw + 120px), 6px); } }
  @keyframes flap { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.55); } }
  @media (prefers-reduced-motion: reduce) { .bird, .bird svg { animation: none; } .bird { display: none; } }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="bird b1"><svg viewBox="0 0 100 60"><path d="M2 8c14 22 26 34 46 36 14-10 30-16 50-14" fill="none" stroke="#E3DED2" stroke-width="7" stroke-linecap="round"/></svg></div>
    <div class="bird b2"><svg viewBox="0 0 100 60"><path d="M2 8c14 22 26 34 46 36 14-10 30-16 50-14" fill="none" stroke="#E3DED2" stroke-width="7" stroke-linecap="round"/></svg></div>
    <div class="bird b3"><svg viewBox="0 0 100 60"><path d="M2 8c14 22 26 34 46 36 14-10 30-16 50-14" fill="none" stroke="#E3DED2" stroke-width="7" stroke-linecap="round"/></svg></div>
  </div>
  <main>
    <img class="logo" src="sf-logo-white.png" width="720" height="263" alt="Scott Free Group">
    <div class="eyebrow">Coming soon</div>
    <h1>Something new is taking shape</h1>
    <p class="lede">We're building a new home for Scott Free. In the meantime, start your own journey of self-discovery.</p>
    <div class="divider" aria-hidden="true"></div>
    <p class="quiz-label">The Six Human Needs Quiz</p>
    <a class="btn" href="/human-needs-quiz/">Discover what drives you
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </a>
    <footer>© <span id="y">2026</span> Scott Free Group</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
